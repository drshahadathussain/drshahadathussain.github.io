def gyroid(x, y, z):
    """Implicit gyroid: F(x,y,z)=t"""
    return (
        np.sin(x) * np.cos(y)
        + np.sin(y) * np.cos(z)
        + np.sin(z) * np.cos(x)
    )

def sample_field(level_fn, n=160, threshold=0.35):
    """Sample level-set on regular grid
    -> scalar field for marching-cubes
    -> watertight, analysis-ready mesh
    """
    grid = np.linspace(0, 2*np.pi, n)
    x, y, z = np.meshgrid(grid, grid, grid)
    return (level_fn(x, y, z) - threshold).astype(np.float32)

# One call, reproducible lattice field
field = sample_field(gyroid, n=160, threshold=0.35)
print(f"field: {field.shape} • ready for meshing")

import numpy as np

def quantify_sem(image_path: str) -> dict:
    """SEM -> phase fractions, no eyeballing"""
    img = cv2.imread(image_path, 0)
    _, binary = cv2.threshold(img, 0, 255, cv2.THRESH_OTSU)
    
    contours, _ = cv2.findContours(
        binary, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE
    )
    
    areas = [cv2.contourArea(c) for c in contours]
    return {
        "oxide_frac": np.mean(areas) / img.size,
        "n_particles": len(contours),
        "mean_diam_um": np.median(areas) ** 0.5 * 0.12
    }
